server:
  port: 8083

aws:
  access-key: ${AWS_ACCESS_KEY_ID:dummy_access_key}
  secret-key: ${AWS_SECRET_ACCESS_KEY:dummy_secret_key}
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${AWS_S3_BUCKET:netflix-clone-media-bucket}

spring:
  application:
    name: streaming-service

  threads:
    virtual:
      enabled: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  servlet:
    multipart:
      enabled: true
      max-file-size: 5GB
      max-request-size: 5GB

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/netflix_streaming_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 30000
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  video:
    storage-path: ${VIDEO_STORAGE_PATH:/tmp/netflix-media/}
    temp-path: ${VIDEO_TEMP_PATH:/tmp/netflix-media/temp/}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true