version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: catalog_redis
    ports:
      - "6379:6379"
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: netflix_catalog_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    restart: always

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_HOST: postgres
      DB_NAME: netflix_catalog_db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 10000
      DEFAULT_POOL_SIZE: 40
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 5
      AUTH_TYPE: plain
    ports:
      - "6432:5432" # Host Mac uses 6432, Container uses 5432
    depends_on:
      - postgres
    restart: always

  catalog-service:
      build: .
      container_name: catalog_service
      ports:
        - "8082:8082"
      environment:
        # 👈 Explicitly point to pgbouncer on port 5432
        SPRING_DATASOURCE_URL: jdbc:postgresql://pgbouncer:5432/netflix_catalog_db
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgres123
        REDIS_HOST: redis
        JAVA_OPTS: "-Xms1g -Xmx3g"
      depends_on:
        - pgbouncer
        - redis
      restart: always