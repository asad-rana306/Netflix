server:
  port: 8082
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 2048
  tomcat:
    threads:
      max: 100
      min-spare: 20
    accept-count: 2000
    max-connections: 2500

spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true                # Enables Java 21 Virtual Threads
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 200      # Allows up to 200 parallel sockets to Redis
          max-idle: 50
          min-idle: 10
          max-wait: 1000ms
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/netflix_catalog_db
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 40        # Lean pool for PgBouncer integration
      minimum-idle: 10
      idle-timeout: 30000
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false                 # Stops terminal logging bottlenecks
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    enabled: false                  # Disables Eureka cleanly for standalone mode
    register-with-eureka: false
    fetch-registry: false