name: Deploy Netflix Microservices to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            set -e

            if [ ! -d "$HOME/Netflix" ]; then
              echo ">>> Directory ~/Netflix not found. Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git ~/Netflix
            fi

            cd ~/Netflix

            echo ">>> Pulling latest code..."
            git fetch --all
            git reset --hard origin/main

            echo ">>> Injecting production secrets..."
            cat << 'EOF' > .env
            ${{ secrets.PROD_ENV_FILE }}
            EOF

            echo ">>> Cleaning up old Docker build cache..."
            docker system prune -f

            echo ">>> Building microservices strictly one by one..."
            docker compose build eureka-server
            docker compose build user-service
            docker compose build catalog-service
            docker compose build streaming-service
            docker compose build payment-service
            docker compose build notification-service
            docker compose build gateway-service

            echo ">>> Launching containers..."
            docker compose down
            docker compose up -d

            echo ">>> Deployment Complete! Active containers:"
            docker compose ps